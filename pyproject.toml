[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scripy"
version = "0.0.1"
description = "A streaming handwriting search index over IIIF, powered by the mole encoder."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mike Kestemont" }]
keywords = ["iiif", "paleography", "handwriting", "retrieval", "manuscripts", "fragmentarium"]

# Stage 0 (IIIF harvesting) is deliberately light: stdlib + typer + numpy. The
# model/codebook come from `mole`, kept as an optional extra because it is a local
# sibling repo (not on PyPI) that pins its own torch stack — install it editable:
#     pip install -e ../mole
# See docs/BLUEPRINT.md §7 (the mole bridge).
dependencies = [
    "typer>=0.12",
    "numpy>=1.26",
]

[project.optional-dependencies]
# The encode/search stages. `mole` provides load_backbone + VLAD + eval.
embed = ["mole"]
# FAISS ANN index arrives at Stage 3 (BLUEPRINT §3); flat numpy until then.
index = ["faiss-cpu>=1.8"]
dev = ["pytest>=8.0"]

[project.scripts]
scripy = "scripy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
